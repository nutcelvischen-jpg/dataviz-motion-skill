<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手把手教你自製 Antigravity Skill (9:16 直式 72s · 大字清晰版)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f4f4f2;
      --text-black: #111111;
      --text-gray: #666666;
      --accent-orange: #ff5722;
      --switch-gray: #d4d4d0;
      --border-light: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e1e;
      color: var(--text-black);
      font-family: 'Noto Sans TC', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      margin-bottom: 16px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #111111;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-tag {
      background: var(--accent-orange);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .viewport-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-cream);
      border-radius: 20px;
      border: 1px solid var(--border-light);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      aspect-ratio: 9 / 16;
      display: flex;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-panel {
      width: 100%;
      max-width: 520px;
      margin-top: 16px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .timeline-row { margin-bottom: 12px; }
    .timeline-bar-wrapper {
      position: relative;
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .timeline-track {
      width: 100%;
      height: 6px;
      background: #e2e2de;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .timeline-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-orange);
    }
    .timeline-thumb {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--accent-orange);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      top: 4px;
      left: 0%;
      pointer-events: none;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      background: #f4f4f2;
      border: 1px solid #d4d4d0;
      color: #111111;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent-orange);
      border: none;
      color: #ffffff;
    }
    .timecode {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #666666;
    }
    .timecode b { color: #111111; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>⚡ Antigravity Skill 實戰教學</span>
      <span class="badge-tag">9:16 大字清晰版</span>
    </div>
    <div style="font-size: 12px; color: #666666;">
      1080×1920 / 72s
    </div>
  </header>

  <main class="viewport-card">
    <canvas id="motionCanvas" width="1080" height="1920"></canvas>
  </main>

  <section class="controls-panel">
    <div class="timeline-row">
      <div class="timeline-bar-wrapper" id="timelineWrapper">
        <div class="timeline-track">
          <div class="timeline-fill" id="timelineFill"></div>
        </div>
        <div class="timeline-thumb" id="timelineThumb"></div>
      </div>
    </div>
    <div class="buttons-row">
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn btn-primary" id="playBtn">▶ 播放</button>
        <button class="btn" id="restartBtn">↺ 重播</button>
        <span class="timecode" id="timeDisplay">00:00 / 01:12</span>
      </div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap;">
        <button class="btn" onclick="jumpToScene(0)">01. 痛點</button>
        <button class="btn" onclick="jumpToScene(1)">02. 結構</button>
        <button class="btn" onclick="jumpToScene(2)">03. 創建</button>
        <button class="btn" onclick="jumpToScene(3)">04. 觸發</button>
        <button class="btn" onclick="jumpToScene(4)">05. 升級</button>
      </div>
    </div>
  </section>

  <audio id="bgmAudio" src="../master_soundtrack_skill_tutorial_72s.wav" preload="auto"></audio>

  <script>
    const CANVAS_WIDTH = 1080;
    const CANVAS_HEIGHT = 1920;
    const FPS = 30;
    const DURATION_SEC = 72;
    const TOTAL_FRAMES = FPS * DURATION_SEC; // 2160 frames

    // 5 Scenes with exact durations: [13s, 13s, 17s, 16s, 13s]
    const SCENES = [
      {
        id: "01",
        startSec: 0,
        durSec: 13,
        tag: "💡 痛點破局",
        headline: "別再重複教 AI！",
        highlight: "把 SOP 封裝成「專屬外掛」",
        sub: "告別每次複製貼上 500 字，插上卡匣 AI 就會做！",
        pill: "💡 核心秘訣：把工作流程固化為 Skill，插卡即用！"
      },
      {
        id: "02",
        startSec: 13,
        durSec: 13,
        tag: "📁 檔案秘密",
        headline: "一個資料夾 ＝ 一個 Skill",
        highlight: "SKILL.md ＋ 漸進式載入黑科技",
        sub: "平時 0 佔用不耗 Token，任務觸發才一秒載入！",
        pill: "📁 一個資料夾 ＋ 一份 SKILL.md，立刻生效！"
      },
      {
        id: "03",
        startSec: 26,
        durSec: 17,
        tag: "💻 實戰創建",
        headline: "一句話，AI 自己寫 Skill！",
        highlight: "免手動建目錄 · AI 全自動封裝",
        sub: "說出你的工作需求，AI 自動建立目錄、代碼與 SOP！",
        pill: "💬 說出需求，Antigravity 自動幫你寫完整個 Skill！"
      },
      {
        id: "04",
        startSec: 43,
        durSec: 16,
        tag: "⚡ 一秒喚醒",
        headline: "隨口一句話，外掛自動跑",
        highlight: "丟入雜亂報表 ➔ 自動精準對帳",
        sub: "說一句「幫我對帳」，AI 自動喚醒專屬 Skill！",
        pill: "⚡ 隨口一句「幫我對帳」，專屬 Skill 零失誤驗算！"
      },
      {
        id: "05",
        startSec: 59,
        durSec: 13,
        tag: "🚀 團隊升級",
        headline: "成為 AI 工作流架構師",
        highlight: "Git 一鍵共享 ➔ 全團隊戰力十倍翻",
        sub: "個人經驗永久固化為團隊資產，經驗傳承零斷層！",
        pill: "✨ 不做手動打工人，升級打造專屬 AI 團隊！"
      }
    ];

    const SWITCH_LABELS = [
      "01. 痛點",
      "02. 結構",
      "03. 創建",
      "04. 喚醒",
      "05. 升級"
    ];

    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');

    let currentFrame = 0;
    let isPlaying = false;
    let audioObj = null;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function spring(t, stiffness = 130, damping = 12) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const omega = Math.sqrt(stiffness);
      const decay = Math.exp(-damping * t * 0.5);
      return 1 - decay * Math.cos(omega * t);
    }

    // Smart CJK + Latin Word-Aware text wrapping (Prevents breaking words like "Skill")
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const tokens = text.match(/[\w\-]+|[^\w\s]|\s+/g) || [text];
      let line = '';
      for (let n = 0; n < tokens.length; n++) {
        const token = tokens[n];
        const testLine = line + token;
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && line.trim().length > 0) {
          context.fillText(line.trim(), x, y);
          line = token.trimStart();
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line.trim().length > 0) {
        context.fillText(line.trim(), x, y);
      }
    }

    function getSceneAtFrame(f) {
      const curSec = f / FPS;
      for (let i = SCENES.length - 1; i >= 0; i--) {
        if (curSec >= SCENES[i].startSec) {
          const localSec = curSec - SCENES[i].startSec;
          const localF = Math.floor(localSec * FPS);
          return { sceneIdx: i, scene: SCENES[i], localF, localSec };
        }
      }
      return { sceneIdx: 0, scene: SCENES[0], localF: f, localSec: f / FPS };
    }

    // -------------------------------------------------------------
    // MAIN DRAW FUNCTION FOR FRAME `f` (0 <= f < 2160)
    // -------------------------------------------------------------
    function drawFrame(f) {
      f = clamp(f, 0, TOTAL_FRAMES - 1);
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Clean Minimalist Off-white Canvas Background
      ctx.fillStyle = "#fbfbfa";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      const { sceneIdx, scene, localF, localSec } = getSceneAtFrame(f);

      // 1. Top Navigation Bar (Sleek Modern)
      drawTopNav(sceneIdx + 1, f);

      // 2. Upper Headline Section (Giant 68px/54px/32px Bold Typography)
      drawUpperInfoSection(scene, localF);

      // 3. Middle Live Demonstration Graphics (960 x 1080, graphY = 520)
      const graphX = 60;
      const graphY = 520;
      const graphW = 960;
      const graphH = 1080;

      switch(sceneIdx) {
        case 0: drawScene0_PainPointVsSkill(graphX, graphY, graphW, graphH, localF); break;
        case 1: drawScene1_FolderStructure(graphX, graphY, graphW, graphH, localF); break;
        case 2: drawScene2_LiveScreenCreation(graphX, graphY, graphW, graphH, localF); break;
        case 3: drawScene3_LiveExecution(graphX, graphY, graphW, graphH, localF); break;
        case 4: drawScene4_ArchitectElevation(graphX, graphY, graphW, graphH, localF); break;
      }

      // 4. Bottom Floating Golden Pill (32px Bold)
      drawCalloutBadgePortrait(CANVAS_WIDTH / 2, 1665, scene.pill);

      // 5. Bottom Switch Dock (5 Large 22px Buttons)
      drawBottomSwitchDock5(sceneIdx, localSec / scene.durSec);
    }

    function drawTopNav(sceneNum, f) {
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.06)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(60, 50, 960, 84, 18);
      ctx.fill();
      ctx.stroke();

      // Orange square logo
      ctx.fillStyle = "#ff5722";
      ctx.beginPath();
      ctx.roundRect(84, 74, 36, 36, 10);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.font = "900 28px 'Plus Jakarta Sans'";
      ctx.textAlign = "left";
      ctx.fillText("ANTIGRAVITY", 134, 101);

      ctx.fillStyle = "#64748b";
      ctx.font = "900 24px 'Noto Sans TC'";
      ctx.fillText("手把手自製 Skill 外掛", 340, 101);

      ctx.textAlign = "right";
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 24px 'Noto Sans TC'";
      ctx.fillText(`步驟 0${sceneNum} / 05`, 885, 101);

      ctx.fillStyle = "#ff5722";
      ctx.font = "800 22px 'JetBrains Mono'";
      ctx.fillText("· 126BPM", 996, 101);
      ctx.restore();
    }

    function drawUpperInfoSection(scene, localF) {
      ctx.save();
      const leftX = 60;
      const topY = 168;

      const enterT = easeOutCubic(clamp(localF / 16, 0, 1));
      ctx.translate(0, (1 - enterT) * 16);

      // Top Tag Badge Pill
      ctx.fillStyle = "#ff5722";
      ctx.beginPath();
      ctx.roundRect(leftX, topY, 260, 54, 14);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 26px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText(`${scene.tag} · ${scene.id}/05`, leftX + 130, topY + 37);
      ctx.textAlign = "left";

      // Giant Headline (68px!)
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 68px 'Noto Sans TC'";
      ctx.letterSpacing = "-0.03em";
      ctx.fillText(scene.headline, leftX, topY + 134);

      // Highlight Line (54px vibrant orange)
      ctx.fillStyle = "#ff5722";
      ctx.font = "900 52px 'Noto Sans TC'";
      ctx.fillText(scene.highlight, leftX, topY + 204);

      // Subtitle / Crisp Takeaway (32px bold)
      ctx.fillStyle = "#475569";
      ctx.font = "700 30px 'Noto Sans TC'";
      ctx.fillText(`⚡ ${scene.sub}`, leftX, topY + 260);

      ctx.restore();
    }

    // --- Scene 0: 痛點破局 (Two Big Vibrant Side-by-Side Hero Cards) ---
    function drawScene0_PainPointVsSkill(x, y, w, h, f) {
      ctx.save();
      const p = spring(clamp(f / 20, 0, 1), 130, 12);

      const gap = 32;
      const boxW = Math.floor((w - gap) / 2); // 464px
      const boxH = h;
      const boxY = y;

      // ==========================================
      // LEFT BOX: 傳統痛點 (Manual Prompting)
      // ==========================================
      const leftBoxX = x;
      ctx.fillStyle = "#fff5f5";
      ctx.strokeStyle = "#f87171";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(leftBoxX, boxY, boxW, boxH, 22);
      ctx.fill();
      ctx.stroke();

      // Red Top Tag Header (26px)
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.roundRect(leftBoxX, boxY, boxW, 72, [22, 22, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 26px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText("❌ 傳統痛點：每次手動重教", leftBoxX + boxW / 2, boxY + 46);

      // Icon & Big Heading
      ctx.font = "72px 'Apple Color Emoji', sans-serif";
      ctx.fillText("😫", leftBoxX + boxW / 2, boxY + 175);

      ctx.fillStyle = "#991b1b";
      ctx.font = "900 40px 'Noto Sans TC'";
      ctx.fillText("每次手打 500 字！", leftBoxX + boxW / 2, boxY + 245);

      // 3 High-Impact Cards (Height 175px each)
      const painCards = [
        { icon: "😫", title: "每次對話都要重教", desc: "每天重複複製貼上，浪費 20 分鐘" },
        { icon: "⚠️", title: "規則容易漏交代", desc: "AI 輸出格式跑掉，越改越心累" },
        { icon: "💸", title: "浪費大量 Token", desc: "每次重複傳長規則，耗時又費錢" }
      ];

      painCards.forEach((pc, idx) => {
        const cy = boxY + 295 + idx * 195;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#fca5a5";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(leftBoxX + 20, cy, boxW - 40, 170, 16);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "left";
        ctx.fillStyle = "#991b1b";
        ctx.font = "900 30px 'Noto Sans TC'";
        ctx.fillText(`${pc.icon} ${pc.title}`, leftBoxX + 42, cy + 58);

        ctx.fillStyle = "#475569";
        ctx.font = "700 24px 'Noto Sans TC'";
        ctx.fillText(pc.desc, leftBoxX + 42, cy + 112);
      });

      // Bottom Warning Pill
      ctx.fillStyle = "#fee2e2";
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(leftBoxX + 20, boxY + boxH - 120, boxW - 40, 85, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#dc2626";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.fillText("😫 每天手動打工，效率極低！", leftBoxX + boxW / 2, boxY + boxH - 66);

      // ==========================================
      // RIGHT BOX: Antigravity Skill (一鍵專屬外掛)
      // ==========================================
      const rightBoxX = x + boxW + gap;
      ctx.save();
      ctx.translate(0, (1 - p) * 16);

      ctx.fillStyle = "#fffaf5";
      ctx.strokeStyle = "#ff5722";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(rightBoxX, boxY, boxW, boxH, 22);
      ctx.fill();
      ctx.stroke();

      // Orange Top Tag Header (26px)
      ctx.fillStyle = "#ff5722";
      ctx.beginPath();
      ctx.roundRect(rightBoxX, boxY, boxW, 72, [22, 22, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 26px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText("⚡ Antigravity Skill：專屬外掛", rightBoxX + boxW / 2, boxY + 46);

      // Icon & Big Heading
      ctx.font = "72px 'Apple Color Emoji', sans-serif";
      ctx.fillText("🎮", rightBoxX + boxW / 2, boxY + 175);

      ctx.fillStyle = "#c2410c";
      ctx.font = "900 40px 'Noto Sans TC'";
      ctx.fillText("插上卡匣，秒變專家！", rightBoxX + boxW / 2, boxY + 245);

      // 3 High-Impact Cards (Height 175px each)
      const skillCards = [
        { icon: "🎯", title: "專屬 SOP 永久固化", desc: "規則直接固化在專案，100% 遵守" },
        { icon: "🎉", title: "隨口一句話自動喚醒", desc: "說「幫我對帳」，AI 零出錯執行" },
        { icon: "🚀", title: "漸進式載入黑科技", desc: "平時 0 佔用，完全不消耗額外 Token" }
      ];

      skillCards.forEach((sc, idx) => {
        const cy = boxY + 295 + idx * 195;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#fed7aa";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(rightBoxX + 20, cy, boxW - 40, 170, 16);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "left";
        ctx.fillStyle = "#15803d";
        ctx.font = "900 30px 'Noto Sans TC'";
        ctx.fillText(`${sc.icon} ${sc.title}`, rightBoxX + 42, cy + 58);

        ctx.fillStyle = "#334155";
        ctx.font = "700 24px 'Noto Sans TC'";
        ctx.fillText(sc.desc, rightBoxX + 42, cy + 112);
      });

      // Bottom Success Pill
      ctx.fillStyle = "#ecfdf5";
      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(rightBoxX + 20, boxY + boxH - 120, boxW - 40, 85, 14);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.fillStyle = "#15803d";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.fillText("🎉 效率翻 10 倍，告別打工！", rightBoxX + boxW / 2, boxY + boxH - 66);

      ctx.restore();
      ctx.restore();
    }

    // --- Scene 1: 檔案秘密 (Folder Structure & Progressive Disclosure) ---
    function drawScene1_FolderStructure(x, y, w, h, f) {
      ctx.save();
      const p = spring(clamp(f / 20, 0, 1), 130, 12);

      // Main Big Card
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 24);
      ctx.fill();
      ctx.stroke();

      // Header Bar (JetBrains Mono 32px)
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.roundRect(x, y, w, 86, [24, 24, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 32px 'JetBrains Mono'";
      ctx.fillText("📁 .agents/skills/excel-auditor/", x + 44, y + 55);

      // 3 Giant Architectural Component Cards (Height 210px each)
      const components = [
        {
          icon: "⭐",
          name: "SKILL.md",
          badge: "【核心大腦】",
          badgeColor: "#ea580c",
          bgColor: "#fff7ed",
          borderColor: "#ff5722",
          desc: "定義 YAML 前言標頭 ＋ 業務 SOP 步驟規範",
          sub: "你的專業知識與審核標準，通通寫在這裡！"
        },
        {
          icon: "🐍",
          name: "scripts/",
          badge: "【自動工具】",
          badgeColor: "#059669",
          bgColor: "#f0fdf4",

    // --- Bottom Switch Dock (5 Large Buttons) ---
    function drawBottomSwitchDock5(activeIdx, localProgress) {
      ctx.save();
      const dockW = 960;
      const dockH = 88;
      const dockX = (CANVAS_WIDTH - dockW) / 2;
      const dockY = CANVAS_HEIGHT - 160;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(dockX, dockY, dockW, dockH, 20);
      ctx.fill();
      ctx.stroke();

      const btnCount = 5;
      const pad = 8;
      const btnW = (dockW - pad * (btnCount + 1)) / btnCount;
      const btnH = dockH - pad * 2;

      for (let i = 0; i < btnCount; i++) {
        const bx = dockX + pad + i * (btnW + pad);
        const by = dockY + pad;
        const isActive = (i === activeIdx);

        if (isActive) {
          ctx.fillStyle = "#ff5722";
          ctx.beginPath();
          ctx.roundRect(bx, by, btnW, btnH, 14);
          ctx.fill();

          // Progress line
          const progressW = btnW * clamp(localProgress, 0, 1);
          ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
          ctx.fillRect(bx + 8, by + 4, progressW - 16, 4);

          ctx.fillStyle = "#ffffff";
          ctx.font = "900 24px 'Noto Sans TC'";
        } else {
          ctx.fillStyle = "#f4f4f2";
          ctx.beginPath();
          ctx.roundRect(bx, by, btnW, btnH, 14);
          ctx.fill();

          ctx.fillStyle = "#475569";
          ctx.font = "800 22px 'Noto Sans TC'";
        }

        ctx.textAlign = "center";
        ctx.fillText(SWITCH_LABELS[i], bx + btnW / 2, by + btnH / 2 + 8);
      }
      ctx.restore();
    }

    // -------------------------------------------------------------
    // INTERACTIVE PLAYER CONTROLS
    // -------------------------------------------------------------
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const timelineWrapper = document.getElementById('timelineWrapper');
    const timelineFill = document.getElementById('timelineFill');
    const timelineThumb = document.getElementById('timelineThumb');
    audioObj = document.getElementById('bgmAudio');

    function updateUI() {
      const pct = (currentFrame / (TOTAL_FRAMES - 1)) * 100;
      timelineFill.style.width = pct + '%';
      timelineThumb.style.left = pct + '%';

      const sec = Math.floor(currentFrame / FPS);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      timeDisplay.innerHTML = `${m}:${s} / 01:12 (格: ${currentFrame})`;
    }

    function renderLoop() {
      if (isPlaying) {
        if (audioObj && !audioObj.paused) {
          currentFrame = Math.floor(audioObj.currentTime * FPS);
        } else {
          currentFrame++;
        }

        if (currentFrame >= TOTAL_FRAMES) {
          currentFrame = TOTAL_FRAMES - 1;
          pause();
        }
        drawFrame(currentFrame);
        updateUI();
        requestAnimationFrame(renderLoop);
      }
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      playBtn.textContent = "⏸ 暫停";
      playBtn.classList.remove('btn-primary');
      if (audioObj) {
        audioObj.currentTime = currentFrame / FPS;
        audioObj.play().catch(e => console.log('Audio autoplay prevented:', e));
      }
      requestAnimationFrame(renderLoop);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = "▶ 播放";
      playBtn.classList.add('btn-primary');
      if (audioObj) audioObj.pause();
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    restartBtn.addEventListener('click', () => {
      pause();
      currentFrame = 0;
      if (audioObj) audioObj.currentTime = 0;
      drawFrame(0);
      updateUI();
      play();
    });

    timelineWrapper.addEventListener('click', (e) => {
      const rect = timelineWrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clamp(clickX / rect.width, 0, 1);
      currentFrame = Math.floor(ratio * TOTAL_FRAMES);
      if (audioObj) audioObj.currentTime = currentFrame / FPS;
      drawFrame(currentFrame);
      updateUI();
    });

    window.jumpToScene = function(idx) {
      currentFrame = SCENES[idx].startSec * FPS;
      if (audioObj) audioObj.currentTime = currentFrame / FPS;
      drawFrame(currentFrame);
      updateUI();
    };

    window.renderFrame = function(f) {
      drawFrame(f);
    };

    document.fonts.ready.then(() => {
      drawFrame(0);
      updateUI();
    });
  </script>
