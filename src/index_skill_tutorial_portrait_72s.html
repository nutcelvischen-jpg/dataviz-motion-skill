<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f4f4f2;
      --text-black: #111111;
      --text-gray: #666666;
      --accent-orange: #ff5722;
      --switch-gray: #d4d4d0;
      --border-light: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e1e;
      color: var(--text-black);
      font-family: 'Noto Sans TC', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      margin-bottom: 16px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #111111;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-tag {
      background: var(--accent-orange);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .viewport-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-cream);
      border-radius: 20px;
      border: 1px solid var(--border-light);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      aspect-ratio: 9 / 16;
      display: flex;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-panel {
      width: 100%;
      max-width: 520px;
      margin-top: 16px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .timeline-row { margin-bottom: 12px; }
    .timeline-bar-wrapper {
      position: relative;
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .timeline-track {
      width: 100%;
      height: 6px;
      background: #e2e2de;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .timeline-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-orange);
    }
    .timeline-thumb {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--accent-orange);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      top: 4px;
      left: 0%;
      pointer-events: none;
    }
    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      background: #f4f4f2;
      border: 1px solid #d4d4d0;
      color: #111111;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent-orange);
      border: none;
      color: #ffffff;
    }
    .timecode {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #666666;
    }
    .timecode b { color: #111111; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>⚡ Antigravity Skill 實戰教學</span>
      <span class="badge-tag">9:16 大字清晰版</span>
    </div>
    <div style="font-size: 12px; color: #666666;">
      1080×1920 / 72s
    </div>
  </header>

  <main class="viewport-card">
    <canvas id="motionCanvas" width="1080" height="1920"></canvas>
  </main>

  <section class="controls-panel">
    <div class="timeline-row">
      <div class="timeline-bar-wrapper" id="timelineWrapper">
        <div class="timeline-track">
          <div class="timeline-fill" id="timelineFill"></div>
        </div>
        <div class="timeline-thumb" id="timelineThumb"></div>
      </div>
    </div>
    <div class="buttons-row">
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn btn-primary" id="playBtn">▶ 播放</button>
        <button class="btn" id="restartBtn">↺ 重播</button>
        <span class="timecode" id="timeDisplay">00:00 / 01:12</span>
      </div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap;">
        <button class="btn" onclick="jumpToScene(0)">01. 痛點</button>
        <button class="btn" onclick="jumpToScene(1)">02. 結構</button>
        <button class="btn" onclick="jumpToScene(2)">03. 創建</button>
        <button class="btn" onclick="jumpToScene(3)">04. 觸發</button>
        <button class="btn" onclick="jumpToScene(4)">05. 升級</button>
      </div>
    </div>
  </section>

  <audio id="bgmAudio" src="../master_soundtrack_skill_tutorial_72s.wav" preload="auto"></audio>

  <script>
    const CANVAS_WIDTH = 1080;
    const CANVAS_HEIGHT = 1920;
    const FPS = 30;
    const DURATION_SEC = 72;
    const TOTAL_FRAMES = FPS * DURATION_SEC; // 2160 frames

    // 5 Scenes with exact durations: [13s, 13s, 17s, 16s, 13s]
    const SCENES = [
      {
        id: "01",
        startSec: 0,
        durSec: 13,
        tag: "💡 痛點破局",
        headline: "別再重複教 AI！",
        highlight: "一秒插上「專屬外掛」",
        sub: "告別每次手打 500 字，插上卡匣 AI 就會！",
        pill: "🔥 規則寫入卡匣，AI 插上就會做！",
        tagColor: "#ef4444",
        highlightColor: "#ff5722"
      },
      {
        id: "02",
        startSec: 13,
        durSec: 13,
        tag: "📁 結構解密",
        headline: "一個資料夾 ＝ 一個 Skill",
        highlight: "3 大核心檔案結構",
        sub: "任務觸發才一秒載入，平常 0 佔用、零耗 Token！",
        pill: "📁 資料夾放進專案，AI 立刻學會新技能！",
        tagColor: "#7c3aed",
        highlightColor: "#8b5cf6"
      },
      {
        id: "03",
        startSec: 26,
        durSec: 17,
        tag: "💻 流程封裝",
        headline: "做了半天？一秒變外掛！",
        highlight: "剛跑通的流程 ➔ 永久資產",
        sub: "別每次重頭教！一句話把「成功流程」封裝為外掛！",
        pill: "💡 流程跑通別重來！一句話封裝成外掛！",
        tagColor: "#0284c7",
        highlightColor: "#06b6d4"
      },
      {
        id: "04",
        startSec: 43,
        durSec: 16,
        tag: "⚡ 一秒喚醒",
        headline: "隨口一句話，外掛自動跑！",
        highlight: "丟入雜亂報表 ➔ 1 秒交付",
        sub: "說一句「幫我對帳」，AI 自動喚醒專屬 Skill！",
        pill: "⚡ 一句話「幫我對帳」，零失誤驗算！",
        tagColor: "#059669",
        highlightColor: "#10b981"
      },
      {
        id: "05",
        startSec: 59,
        durSec: 13,
        tag: "🚀 團隊升級",
        headline: "成為 AI 工作流架構師",
        highlight: "Git 一鍵共享 ➔ 戰力翻倍",
        sub: "個人經驗永久固化為團隊資產，經驗傳承零斷層！",
        pill: "✨ 擺脫重複打工，打造專屬 AI 軍團！",
        tagColor: "#d97706",
        highlightColor: "#f59e0b"
      }
    ];

    const SWITCH_LABELS = [
      "01. 痛點",
      "02. 結構",
      "03. 流程",
      "04. 喚醒",
      "05. 升級"
    ];

    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');

    let currentFrame = 0;
    let isPlaying = false;
    let audioObj = null;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function spring(t, stiffness = 130, damping = 12) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const omega = Math.sqrt(stiffness);
      const decay = Math.exp(-damping * t * 0.5);
      return 1 - decay * Math.cos(omega * t);
    }

    // Smart CJK + Latin Word-Aware text wrapping (Prevents breaking words like "Skill")
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const tokens = text.match(/[\w\-]+|[^\w\s]|\s+/g) || [text];
      let line = '';
      for (let n = 0; n < tokens.length; n++) {
        const token = tokens[n];
        const testLine = line + token;
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && line.trim().length > 0) {
          context.fillText(line.trim(), x, y);
          line = token.trimStart();
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line.trim().length > 0) {
        context.fillText(line.trim(), x, y);
      }
    }

    function getSceneAtFrame(f) {
      const curSec = f / FPS;
      for (let i = SCENES.length - 1; i >= 0; i--) {
        if (curSec >= SCENES[i].startSec) {
          const localSec = curSec - SCENES[i].startSec;
          const localF = Math.floor(localSec * FPS);
          return { sceneIdx: i, scene: SCENES[i], localF, localSec };
        }
      }
      return { sceneIdx: 0, scene: SCENES[0], localF: f, localSec: f / FPS };
    }

    // -------------------------------------------------------------
    // MAIN DRAW FUNCTION FOR FRAME `f` (0 <= f < 2160)
    // -------------------------------------------------------------
    function drawFrame(f) {
      f = clamp(f, 0, TOTAL_FRAMES - 1);
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Clean Minimalist Off-white Canvas Background
      ctx.fillStyle = "#fbfbfa";
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      const { sceneIdx, scene, localF, localSec } = getSceneAtFrame(f);

      // 1. Top Navigation Bar (Sleek Modern)
      drawTopNav(sceneIdx + 1, f);

      // 2. Upper Headline Section (Giant 68px/54px/32px Bold Typography)
      drawUpperInfoSection(scene, localF);

      // 3. Middle Live Demonstration Graphics (960 x 1080, graphY = 520)
      const graphX = 60;
      const graphY = 520;
      const graphW = 960;
      const graphH = 1080;

      switch(sceneIdx) {
        case 0: drawScene0_PainPointVsSkill(graphX, graphY, graphW, graphH, localF); break;
        case 1: drawScene1_FolderStructure(graphX, graphY, graphW, graphH, localF); break;
        case 2: drawScene2_LiveScreenCreation(graphX, graphY, graphW, graphH, localF); break;
        case 3: drawScene3_LiveExecution(graphX, graphY, graphW, graphH, localF); break;
        case 4: drawScene4_ArchitectElevation(graphX, graphY, graphW, graphH, localF); break;
      }

      // 4. Bottom Floating Golden Pill (32px Bold)
      drawCalloutBadgePortrait(CANVAS_WIDTH / 2, 1665, scene.pill, scene.tagColor);

      // 5. Bottom Switch Dock (5 Large 22px Buttons)
      drawBottomSwitchDock5(sceneIdx, localSec / scene.durSec, scene.tagColor);
    }

    function drawTopNav(sceneNum, f) {
      ctx.save();
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.06)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(60, 50, 960, 84, 18);
      ctx.fill();
      ctx.stroke();

      // Orange square logo
      ctx.fillStyle = "#ff5722";
      ctx.beginPath();
      ctx.roundRect(84, 74, 36, 36, 10);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.font = "900 28px 'Plus Jakarta Sans'";
      ctx.textAlign = "left";
      ctx.fillText("ANTIGRAVITY", 134, 101);

      ctx.fillStyle = "#64748b";
      ctx.font = "900 24px 'Noto Sans TC'";
      ctx.fillText("手把手自製 Skill 外掛", 340, 101);

      ctx.textAlign = "right";
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 24px 'Noto Sans TC'";
      ctx.fillText(`步驟 0${sceneNum} / 05`, 885, 101);

      ctx.fillStyle = "#ff5722";
      ctx.font = "800 22px 'JetBrains Mono'";
      ctx.fillText("· 126BPM", 996, 101);
      ctx.restore();
    }

    function drawUpperInfoSection(scene, localF) {
      ctx.save();
      const leftX = 60;
      const topY = 168;

      const enterT = easeOutCubic(clamp(localF / 16, 0, 1));
      ctx.translate(0, (1 - enterT) * 16);

      // Top Tag Badge Pill
      ctx.fillStyle = scene.tagColor || "#ff5722";
      ctx.beginPath();
      ctx.roundRect(leftX, topY, 260, 54, 14);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 26px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText(`${scene.tag} · ${scene.id}/05`, leftX + 130, topY + 37);
      ctx.textAlign = "left";

      // Giant Headline (68px!)
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 68px 'Noto Sans TC'";
      ctx.letterSpacing = "-0.03em";
      ctx.fillText(scene.headline, leftX, topY + 134);

      // Highlight Line (52px vibrant theme color)
      ctx.fillStyle = scene.highlightColor || "#ff5722";
      ctx.font = "900 52px 'Noto Sans TC'";
      ctx.fillText(scene.highlight, leftX, topY + 204);

      // Subtitle / Crisp Takeaway (32px bold)
      ctx.fillStyle = "#475569";
      ctx.font = "700 30px 'Noto Sans TC'";
      ctx.fillText(`⚡ ${scene.sub}`, leftX, topY + 260);

      ctx.restore();
    }

    // --- Scene 0: 痛點破局 (Two Big Vibrant Side-by-Side Hero Cards · Ultra-Minimal) ---
    function drawScene0_PainPointVsSkill(x, y, w, h, f) {
      ctx.save();
      const p = spring(clamp(f / 20, 0, 1), 130, 12);

      const gap = 32;
      const boxW = Math.floor((w - gap) / 2); // 464px
      const boxH = h;
      const boxY = y;

      // ==========================================
      // LEFT BOX: 傳統痛點 (Manual Prompting)
      // ==========================================
      const leftBoxX = x;
      ctx.fillStyle = "#fff1f2";
      ctx.strokeStyle = "#f43f5e";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(leftBoxX, boxY, boxW, boxH, 22);
      ctx.fill();
      ctx.stroke();

      // Red Top Tag Header
      ctx.fillStyle = "#e11d48";
      ctx.beginPath();
      ctx.roundRect(leftBoxX, boxY, boxW, 76, [22, 22, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText("❌ 傳統痛點：手動重教", leftBoxX + boxW / 2, boxY + 48);

      // Icon & Big Heading
      ctx.font = "88px 'Apple Color Emoji', sans-serif";
      ctx.fillText("😫", leftBoxX + boxW / 2, boxY + 195);

      ctx.fillStyle = "#881337";
      ctx.font = "900 46px 'Noto Sans TC'";
      ctx.fillText("手打 500 字", leftBoxX + boxW / 2, boxY + 270);

      ctx.fillStyle = "#be123c";
      ctx.font = "800 28px 'Noto Sans TC'";
      ctx.fillText("每次對話重頭教起！", leftBoxX + boxW / 2, boxY + 318);

      // 2 Ultra-Minimal High-Impact Cards
      const painPills = [
        { icon: "⚠️", title: "規則容易漏交代", color: "#9f1239", border: "#fca5a5" },
        { icon: "💸", title: "白白浪費 Token", color: "#9f1239", border: "#fca5a5" }
      ];

      painPills.forEach((pp, idx) => {
        const cy = boxY + 370 + idx * 220;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = pp.border;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(leftBoxX + 24, cy, boxW - 48, 180, 18);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = pp.color;
        ctx.font = "900 36px 'Noto Sans TC'";
        ctx.fillText(`${pp.icon} ${pp.title}`, leftBoxX + boxW / 2, cy + 104);
      });

      // Bottom Warning Pill (Solid Vibrant Red Fill!)
      ctx.fillStyle = "#e11d48";
      ctx.beginPath();
      ctx.roundRect(leftBoxX + 24, boxY + boxH - 145, boxW - 48, 100, 16);
      ctx.fill();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.fillText("😫 每天重複打工 · 效率極低", leftBoxX + boxW / 2, boxY + boxH - 84);

      // ==========================================
      // RIGHT BOX: Antigravity Skill (一鍵專屬外掛)
      // ==========================================
      const rightBoxX = x + boxW + gap;
      ctx.save();
      ctx.translate(0, (1 - p) * 16);

      ctx.fillStyle = "#fff7ed";
      ctx.strokeStyle = "#ff5722";
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.roundRect(rightBoxX, boxY, boxW, boxH, 22);
      ctx.fill();
      ctx.stroke();

      // Orange Top Tag Header
      ctx.fillStyle = "#ff5722";
      ctx.beginPath();
      ctx.roundRect(rightBoxX, boxY, boxW, 76, [22, 22, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.textAlign = "center";
      ctx.fillText("⚡ 專屬外掛卡匣", rightBoxX + boxW / 2, boxY + 48);

      // Icon & Big Heading
      ctx.font = "88px 'Apple Color Emoji', sans-serif";
      ctx.fillText("⚡", rightBoxX + boxW / 2, boxY + 195);

      ctx.fillStyle = "#9a3412";
      ctx.font = "900 46px 'Noto Sans TC'";
      ctx.fillText("插上卡匣秒變專家", rightBoxX + boxW / 2, boxY + 270);

      ctx.fillStyle = "#c2410c";
      ctx.font = "800 28px 'Noto Sans TC'";
      ctx.fillText("工作流程永久固化！", rightBoxX + boxW / 2, boxY + 318);

      // 2 Ultra-Minimal High-Impact Cards
      const skillPills = [
        { icon: "🎯", title: "SOP 永久固化", color: "#15803d", bg: "#f0fdf4", border: "#22c55e" },
        { icon: "🚀", title: "一句話秒自動執行", color: "#0369a1", bg: "#f0f9ff", border: "#0ea5e9" }
      ];

      skillPills.forEach((sp, idx) => {
        const cy = boxY + 370 + idx * 220;
        ctx.fillStyle = sp.bg;
        ctx.strokeStyle = sp.border;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(rightBoxX + 24, cy, boxW - 48, 180, 18);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = sp.color;
        ctx.font = "900 36px 'Noto Sans TC'";
        ctx.fillText(`${sp.icon} ${sp.title}`, rightBoxX + boxW / 2, cy + 104);
      });

      // Bottom Success Pill (Solid Vibrant Emerald Fill!)
      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.roundRect(rightBoxX + 24, boxY + boxH - 145, boxW - 48, 100, 16);
      ctx.fill();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 28px 'Noto Sans TC'";
      ctx.fillText("🎉 效率飆升 10 倍 · 告別打工！", rightBoxX + boxW / 2, boxY + boxH - 84);

      ctx.restore();
      ctx.restore();
    }

    // --- Scene 1: 檔案秘密 (Folder Structure & Progressive Disclosure · Ultra-Minimal & Rich) ---
    function drawScene1_FolderStructure(x, y, w, h, f) {
      ctx.save();
      const p = spring(clamp(f / 20, 0, 1), 130, 12);

      // Main Container Card
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 24);
      ctx.fill();
      ctx.stroke();

      // Header Bar (JetBrains Mono 32px)
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.roundRect(x, y, w, 86, [24, 24, 0, 0]);
      ctx.fill();

      ctx.fillStyle = "#38bdf8";
      ctx.font = "900 32px 'JetBrains Mono'";
      ctx.fillText("📁 .agents/skills/excel-auditor/", x + 44, y + 55);

      // 3 Giant Architectural Component Cards (Height 215px each · Ultra-Minimal)
      const components = [
        {
          icon: "⭐",
          name: "SKILL.md",
          badge: "核心大腦",
          badgeBg: "#ea580c",
          bgColor: "#fff7ed",
          borderColor: "#f97316",
          titleColor: "#c2410c",
          punchline: "👉 業務 SOP ＋ 規則標準永久固化"
        },
        {
          icon: "🐍",
          name: "scripts/",
          badge: "專用工具",
          badgeBg: "#059669",
          bgColor: "#f0fdf4",
          borderColor: "#10b981",
          titleColor: "#047857",
          punchline: "👉 Python 自動化腳本，清洗髒資料"
        },
        {
          icon: "📊",
          name: "examples/",
          badge: "標準範本",
          badgeBg: "#0284c7",

    // --- Bottom Switch Dock (5 Large Buttons) ---
    function drawBottomSwitchDock5(activeIdx, localProgress, activeColor) {
      ctx.save();
      const themeColor = activeColor || "#ff5722";
      const dockW = 960;
      const dockH = 88;
      const dockX = (CANVAS_WIDTH - dockW) / 2;
      const dockY = CANVAS_HEIGHT - 160;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(dockX, dockY, dockW, dockH, 20);
      ctx.fill();
      ctx.stroke();

      const btnCount = 5;
      const pad = 8;
      const btnW = (dockW - pad * (btnCount + 1)) / btnCount;
      const btnH = dockH - pad * 2;

      for (let i = 0; i < btnCount; i++) {
        const bx = dockX + pad + i * (btnW + pad);
        const by = dockY + pad;
        const isActive = (i === activeIdx);

        if (isActive) {
          ctx.fillStyle = themeColor;
          ctx.beginPath();
          ctx.roundRect(bx, by, btnW, btnH, 14);
          ctx.fill();

          // Progress line
          const progressW = btnW * clamp(localProgress, 0, 1);
          ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
          ctx.fillRect(bx + 8, by + 4, progressW - 16, 4);

          ctx.fillStyle = "#ffffff";
          ctx.font = "900 24px 'Noto Sans TC'";
        } else {
          ctx.fillStyle = "#f4f4f2";
          ctx.beginPath();
          ctx.roundRect(bx, by, btnW, btnH, 14);
          ctx.fill();

          ctx.fillStyle = "#475569";
          ctx.font = "800 22px 'Noto Sans TC'";
        }

        ctx.textAlign = "center";
        ctx.fillText(SWITCH_LABELS[i], bx + btnW / 2, by + btnH / 2 + 8);
      }
      ctx.restore();
    }

      timelineThumb.style.left = pct + '%';

      const sec = Math.floor(currentFrame / FPS);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      timeDisplay.innerHTML = `${m}:${s} / 01:12 (格: ${currentFrame})`;
    }

    function renderLoop() {
      if (isPlaying) {
        if (audioObj && !audioObj.paused) {
          currentFrame = Math.floor(audioObj.currentTime * FPS);
        } else {
          currentFrame++;
        }

        if (currentFrame >= TOTAL_FRAMES) {
          currentFrame = TOTAL_FRAMES - 1;
          pause();
        }
        drawFrame(currentFrame);
        updateUI();
        requestAnimationFrame(renderLoop);
      }
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      playBtn.textContent = "⏸ 暫停";
      playBtn.classList.remove('btn-primary');
      if (audioObj) {
        audioObj.currentTime = currentFrame / FPS;
        audioObj.play().catch(e => console.log('Audio autoplay prevented:', e));
      }
      requestAnimationFrame(renderLoop);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = "▶ 播放";
      playBtn.classList.add('btn-primary');
      if (audioObj) audioObj.pause();
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    restartBtn.addEventListener('click', () => {
      pause();
      currentFrame = 0;
      if (audioObj) audioObj.currentTime = 0;
      drawFrame(0);
      updateUI();
      play();
    });

    timelineWrapper.addEventListener('click', (e) => {
      const rect = timelineWrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clamp(clickX / rect.width, 0, 1);
      currentFrame = Math.floor(ratio * TOTAL_FRAMES);
      if (audioObj) audioObj.currentTime = currentFrame / FPS;
      drawFrame(currentFrame);
      updateUI();
    });

    window.jumpToScene = function(idx) {
      currentFrame = SCENES[idx].startSec * FPS;
      if (audioObj) audioObj.currentTime = currentFrame / FPS;
      drawFrame(currentFrame);
      updateUI();
    };

    window.renderFrame = function(f) {
      drawFrame(f);
    };

    document.fonts.ready.then(() => {
      drawFrame(0);
      updateUI();
    });
  </script>
</body>
</html>
