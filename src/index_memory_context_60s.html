    // 繪製美漫放射速度線 (Manga Speed Lines / Sunburst Rays)
    function drawSpeedLines(context, cx, cy, numRays, col1, col2, rotAngle) {
      context.save();
      context.fillStyle = col1;
      context.fillRect(0, 0, 1080, 1920);

      const maxR = Math.hypot(1080, 1920);
      context.translate(cx, cy);
      context.rotate(rotAngle);

      context.fillStyle = col2;
      const step = (Math.PI * 2) / numRays;
      for (let i = 0; i < numRays; i += 2) {
        context.beginPath();
        context.moveTo(0, 0);
        context.arc(0, 0, maxR, i * step, (i + 1) * step);
        context.closePath();
        context.fill();
      }
      context.restore();

      // 波普半調圓點 (Halftone Dots)
      context.save();
      context.fillStyle = 'rgba(0, 0, 0, 0.16)';
      const dotSpacing = 36;
      for (let x = 18; x < 1080; x += dotSpacing) {
        for (let y = 18; y < 1920; y += dotSpacing) {
          const dist = Math.hypot(x - cx, y - cy);
          if (dist > 350) {
            const rad = Math.min(5.5, (dist / 1920) * 8);
            context.beginPath();
            context.arc(x, y, rad, 0, Math.PI * 2);
            context.fill();
          }
        }
      }
      context.restore();
    }

    // 繪製美漫風格卡片 (帶黑色硬邊投影)
    function drawComicCard(context, x, y, w, h, bg = '#FFFFFF', tiltDeg = 0, shadowOffset = 8) {
      context.save();
      context.translate(x + w / 2, y + h / 2);
      context.rotate((tiltDeg * Math.PI) / 180);

      // 1. 黑色硬邊投影 (No Blur)
      context.fillStyle = '#000000';
      context.fillRect(-w / 2 + shadowOffset, -h / 2 + shadowOffset, w, h);

      // 2. 卡片本體
      context.fillStyle = bg;
      context.fillRect(-w / 2, -h / 2, w, h);

      // 3. 粗黑邊框
      context.strokeStyle = '#000000';
      context.lineWidth = 5;
      context.strokeRect(-w / 2, -h / 2, w, h);

      context.restore();
    }

    // 繪製美漫爆炸貼紙 (Jagged Starburst / Comic Burst)
    function drawBurst(context, cx, cy, rOuter, rInner, points, fill = '#FACC15', text = '10萬★') {
      context.save();
      context.translate(cx, cy);

      // 投影
      context.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = (i % 2 === 0) ? rOuter : rInner;
        const angle = (i * Math.PI) / points;
        const x = Math.cos(angle) * r + 6;
        const y = Math.sin(angle) * r + 6;
        if (i === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
      context.fillStyle = '#000000';
      context.fill();

      // 爆炸星本體
      context.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = (i % 2 === 0) ? rOuter : rInner;
        const angle = (i * Math.PI) / points;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
      context.fillStyle = fill;
      context.fill();
      context.strokeStyle = '#000000';
      context.lineWidth = 5;
      context.stroke();

      // 貼紙字樣
      if (text) {
        context.fillStyle = '#000000';
        context.font = '900 32px "Noto Sans TC", sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(text, 0, 2);
      }
      context.restore();
    }

    // 繪製漫畫對話氣泡 (Speech Bubble)
    function drawSpeechBubble(context, x, y, w, h, text, isLeft = true, bg = '#FFFFFF') {
      context.save();
      // 投影
      context.fillStyle = '#000000';
      context.beginPath();
      context.roundRect(x + 6, y + 6, w, h, 14);
      context.fill();

      // 本體
      context.fillStyle = bg;
      context.beginPath();
      context.roundRect(x, y, w, h, 14);
      context.fill();
      context.strokeStyle = '#000000';
      context.lineWidth = 4;
      context.stroke();

      // 尖角 Tail
      context.beginPath();
      if (isLeft) {
        context.moveTo(x + 40, y + h);
        context.lineTo(x + 20, y + h + 24);
        context.lineTo(x + 65, y + h);
      } else {
        context.moveTo(x + w - 40, y + h);
        context.lineTo(x + w - 20, y + h + 24);
        context.lineTo(x + w - 65, y + h);
      }
      context.fillStyle = bg;
      context.fill();
      context.stroke();

      // 文字
      context.fillStyle = '#000000';
      context.font = '800 28px "Noto Sans TC", sans-serif';
      context.textAlign = 'center';
      context.fillText(text, x + w / 2, y + h / 2 + 10);
      context.restore();
    }

    // 繪製參考片招牌：黃底黑框「旁白 NARRATOR」字幕條
    function drawMangaSubtitle(context, segments, baseY) {
      context.save();
      const boxW = 960;
      const boxH = 150;
      const boxX = (1080 - boxW) / 2;
      const boxY = baseY;

      // 1. 旁白 NARRATOR 標籤膠囊 (左上角突出)
      context.fillStyle = '#000000';
      context.fillRect(boxX + 2, boxY - 40, 220, 42);
      context.fillStyle = '#FFFFFF';
      context.fillRect(boxX - 2, boxY - 44, 220, 42);
      context.strokeStyle = '#000000';
      context.lineWidth = 3.5;
      context.strokeRect(boxX - 2, boxY - 44, 220, 42);

      context.fillStyle = '#000000';
      context.font = '900 20px "Noto Sans TC", sans-serif';
      context.fillText('旁白 NARRATOR', boxX + 16, boxY - 16);

      // 2. 黃色字幕主方塊 (帶硬邊黑影)
      context.fillStyle = '#000000';
      context.fillRect(boxX + 8, boxY + 8, boxW, boxH);

      context.fillStyle = '#FACC15'; // 招牌鮮黃
      context.fillRect(boxX, boxY, boxW, boxH);
      context.strokeStyle = '#000000';
      context.lineWidth = 5;
      context.strokeRect(boxX, boxY, boxW, boxH);

      // 3. 粗體字串居中排版 (黑字 + 紅色關鍵字高光)
      context.font = '900 46px "Noto Sans TC", sans-serif';
      let totalW = 0;
      const metrics = segments.map(seg => {
        const w = context.measureText(seg.text).width;
        totalW += w;
        return { ...seg, width: w };
      });

      let startX = boxX + (boxW - totalW) / 2;
      const textY = boxY + 92;

      metrics.forEach(seg => {
        context.fillStyle = seg.red ? '#EF4444' : '#000000';
        context.fillText(seg.text, startX, textY);
        startX += seg.width;
      });

      context.restore();
    }

    function drawNarratorAvatar(context, cx, cy, rad) {
      context.save();
      context.translate(cx, cy);

      // 1. 黑色硬邊投影 (Offset 8px)
      context.beginPath();
      context.arc(8, 8, rad, 0, Math.PI * 2);
      context.fillStyle = '#000000';
      context.fill();

      // 2. 白色基底圓盤
      context.beginPath();
      context.arc(0, 0, rad, 0, Math.PI * 2);
      context.fillStyle = '#FFFFFF';
      context.fill();

      // 3. 繪製精緻主播頭像
      if (avatarImg.complete) {
        context.save();
        context.beginPath();
        context.arc(0, 0, rad - 4, 0, Math.PI * 2);
        context.clip();
        context.drawImage(avatarImg, -rad + 4, -rad + 4, (rad - 4) * 2, (rad - 4) * 2);
        context.restore();
      }

      // 4. 外層粗黑邊框 (4px)
      context.beginPath();
      context.arc(0, 0, rad, 0, Math.PI * 2);
      context.strokeStyle = '#000000';
      context.lineWidth = 5;
      context.stroke();

      context.restore();
    }

    // 核心逐幀渲染器 (60 FPS 美漫波普炸裂風)
    function renderFrame(f) {
      ctx.clearRect(0, 0, 1080, 1920);

      const actIdx = Math.min(3, Math.floor(f / FRAMES_PER_ACT));
      const act = ACTS[actIdx];
      const localFrame = f % FRAMES_PER_ACT;
      const localSec = localFrame / FPS;

      // 1. 背景：動態旋轉漫畫速度線 (Radial Sunburst)
      const rot = (f / 30) * 0.08;
      drawSpeedLines(ctx, 540, 960, 36, act.bgHue, act.bgDark, rot);

      // 2. 頂部雙標籤 (Top Comic Badges)
      ctx.save();
      // 左側標籤 (傾斜 -2.5°)
      drawComicCard(ctx, 70, 70, 420, 68, '#FACC15', -2.5, 5);
      ctx.fillStyle = '#000000';
      ctx.font = '900 26px "Noto Sans TC", sans-serif';
      ctx.fillText(act.badgeLeft, 100, 114);

      // 右側標籤 (傾斜 +2°)
      drawComicCard(ctx, 640, 70, 370, 68, '#EF4444', 2.0, 5);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 26px "Noto Sans TC", sans-serif';
      ctx.fillText(act.badgeRight, 675, 114);
      ctx.restore();

      // 3. 巨幅漫畫標題 (3D 粗體黑邊)
      ctx.save();
      ctx.font = '900 52px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      // 黑色投影厚邊
      ctx.fillStyle = '#000000';
      ctx.fillText(act.heroTitle, 544, 214);
      ctx.fillText(act.heroTitle, 540, 214);
      // 主體白字
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(act.heroTitle, 540, 210);
      ctx.restore();

      // 4. 中央舞台美漫插畫 (Main Comic Stage - 雙層豐滿架構)
      ctx.save();
      if (actIdx === 0) {
        // ========== 幕 1 · 🐱 甜蜜謊言 (AI 記得貓咪) ==========
        // 卡片 1: 對話模擬器主舞台
        drawComicCard(ctx, 90, 260, 900, 680, '#FFFFFF', -1.2, 10);
        
        // 貓咪可愛插圖
        ctx.font = '110px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🐱', 240, 460);
        ctx.font = '900 28px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#1C1917';
        ctx.fillText('咪咪 (橘貓)', 240, 520);

        // 對話氣泡 1 (使用者介紹)
        drawSpeechBubble(ctx, 380, 330, 560, 90, '「我有養一隻貓叫咪咪」', true, '#FEF08A');

        // 對話氣泡 2 (使用者考題)
        drawSpeechBubble(ctx, 380, 470, 560, 90, '「我養的貓叫什麼名字？」', true, '#EEF2FF');

        // AI 完美回答氣泡 (閃亮登場)
        drawSpeechBubble(ctx, 150, 670, 780, 110, '🤖「你家的貓咪叫咪咪！」', false, '#DCFCE7');

        // 爆炸星貼紙
        drawBurst(ctx, 890, 310, 100, 65, 12, '#EF4444', '記住了★');

        // 下層呼應卡片 (y = 980)
        drawComicCard(ctx, 90, 980, 900, 170, '#FEF9C3', 1.0, 8);
        ctx.fillStyle = '#713F12';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💭 人類錯覺：「天啊！AI 像真人一樣記住我了！」', 540, 1050);
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#854D0E';
        ctx.fillText('萬億參數的背後，真的有持續運作的記憶腦細胞嗎？', 540, 1100);

      } else if (actIdx === 1) {
        // ========== 幕 2 · 🐠 殘酷真相 (0 秒失憶金魚腦) ==========
        drawComicCard(ctx, 90, 260, 900, 680, '#FFFFFF', 1.2, 10);

        // 金魚腦插圖
        ctx.font = '120px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🐠', 250, 460);
        ctx.font = '900 28px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#DC2626';
        ctx.fillText('0 秒失憶金魚腦', 250, 520);

        // 巨幅警示方塊
        drawComicCard(ctx, 390, 320, 560, 140, '#FEE2E2', -1.0, 6);
        ctx.fillStyle = '#DC2626';
        ctx.font = '900 34px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('❌ 根本沒有記憶硬碟！', 670, 380);
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#991B1B';
        ctx.fillText('回答完畢立刻遺忘，連你是誰都不知道', 670, 425);

        // 靜態矩陣示意
        drawComicCard(ctx, 140, 560, 800, 250, '#F8FAFC', 0, 6);
        ctx.fillStyle = '#0F172A';
        ctx.font = '900 26px "JetBrains Mono", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('完全無狀態靜態矩陣 (Stateless Matrix)', 540, 620);

        ctx.font = '700 22px "JetBrains Mono", sans-serif';
        ctx.fillStyle = '#2563EB';
        ctx.fillText('Y = Softmax( W_frozen · X + b )', 540, 675);
        ctx.fillStyle = '#DC2626';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('⚠️ 請求一結束，上下文緩存立刻被垃圾回收清空！', 540, 740);

        // 爆炸貼紙
        drawBurst(ctx, 160, 310, 95, 60, 12, '#FACC15', '0秒失憶!');

        // 下層呼應卡片 (y = 980)
        drawComicCard(ctx, 90, 980, 900, 170, '#FEE2E2', -0.8, 8);
        ctx.fillStyle = '#991B1B';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💥 核心定理：大語言模型是無狀態數學函數！', 540, 1050);
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#B91C1C';
        ctx.fillText('每一次 API 呼叫，它都把你當成全新的第一位訪客。', 540, 1100);

      } else if (actIdx === 2) {
        // ========== 幕 3 · 📝 魔術揭密 (前端偷塞對話小抄) ==========
        drawComicCard(ctx, 90, 260, 900, 680, '#FFFFFF', -1.0, 10);

        // 小抄堆疊視覺 (Stack of Cheat Sheets)
        const papers = [
          { t: '輪次 1: 我養一隻貓叫咪咪', bg: '#FEF9C3' },
          { t: '輪次 1 回覆: 好的，已記住咪咪！', bg: '#F0FDF4' },
          { t: '輪次 2: 今天台北天氣怎麼樣？', bg: '#EFF6FF' },
          { t: '輪次 2 回覆: 今天是晴天。', bg: '#FAF5FF' },
          { t: '輪次 3: 我家的貓叫什麼名字？', bg: '#FFF1F2' }
        ];

        papers.forEach((p, idx) => {
          const py = 310 + idx * 72;
          drawComicCard(ctx, 140, py, 800, 64, p.bg, (idx % 2 === 0 ? 0.6 : -0.6), 4);
          ctx.fillStyle = '#000000';
          ctx.font = '800 22px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(`📄 對話小抄第 ${idx + 1} 頁: ${p.t}`, 180, py + 40);
        });

        // 偷塞箭頭
        ctx.fillStyle = '#DC2626';
        ctx.font = '900 26px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('👇 前端應用偷偷把歷史全部打包成一份長小抄，每次整本重送！', 540, 720);

        // 爆炸星
        drawBurst(ctx, 890, 310, 100, 65, 12, '#38BDF8', '對話小抄!');

        // 下層呼應卡片 (y = 980)
        drawComicCard(ctx, 90, 980, 900, 170, '#E0F2FE', 1.0, 8);
        ctx.fillStyle = '#0369A1';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚡ 驚人真相：你聊得越長，每句話傳輸量越大！', 540, 1050);
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#0284C7';
        ctx.fillText('你以為它在動腦回憶，其實它只是每次把小抄重讀一次！', 540, 1100);

      } else {
        // ========== 幕 4 · ✂️ 極限翻車 (小抄超長被剪斷) ==========
        drawComicCard(ctx, 90, 260, 900, 680, '#FFFFFF', 1.0, 10);

        // 巨大剪刀剪斷小抄
        ctx.font = '100px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✂️', 260, 410);

        drawComicCard(ctx, 390, 320, 560, 130, '#FEE2E2', -1.0, 6);
        ctx.fillStyle = '#DC2626';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.fillText('超出 Context Window！', 670, 375);
        ctx.font = '700 22px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#7F1D1D';
        ctx.fillText('頂部歷史小抄被強制裁切扔掉！', 670, 415);

        // 貓咪名字蒸發
        drawComicCard(ctx, 140, 490, 800, 130, '#FFFBEB', 0, 6);
        ctx.fillStyle = '#B45309';
        ctx.font = '800 26px "Noto Sans TC", sans-serif';
        ctx.fillText('第 1 頁「咪咪」已經不在當前小抄裡了！', 540, 545);
        ctx.fillStyle = '#DC2626';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.fillText('🤖 AI 困惑反問：「請問你養了什麼寵物？叫什麼名字？」', 540, 595);

        // 底部呼籲按鈕
        drawComicCard(ctx, 140, 660, 800, 95, '#FACC15', -1.0, 6);
        ctx.fillStyle = '#000000';
        ctx.font = '900 30px "Noto Sans TC", sans-serif';
        ctx.fillText('👉 到極簡實驗室，親自測測看！', 540, 720);

        drawBurst(ctx, 160, 310, 95, 60, 12, '#EF4444', '咔嚓剪掉!');

        // 下層呼應卡片 (y = 980)
        drawComicCard(ctx, 90, 980, 900, 170, '#FEF08A', -1.0, 8);
        ctx.fillStyle = '#713F12';
        ctx.font = '900 32px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📌 認知帶走：學會管理上下文，才不會白花冤枉錢！', 540, 1050);
        ctx.font = '700 24px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#854D0E';
        ctx.fillText('點擊下方連結，親手在 Playground 測試模型記憶極限！', 540, 1100);
      }
      ctx.restore();

      // 5. 動態字幕選取 (依照音訊秒數同步精準切換)
      let activeCue = act.cues[0];
      for (const cue of act.cues) {
        if (localSec >= cue.startSec && localSec < cue.endSec) {
          activeCue = cue;
          break;
        }
      }

      // 6. 招牌黃色美漫字幕條 (y = 1420)
      drawMangaSubtitle(ctx, activeCue.segments, 1420);

      // 7. 右下角主播圓形頭像 (Host Circle Avatar: cx=940, cy=1620)
      drawNarratorAvatar(ctx, 940, 1620, 100);

      // 8. 底部安全進度條
      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.fillRect(80, 1850, 920, 12);
      ctx.fillStyle = '#FACC15';
      ctx.fillRect(80, 1850, (f / TOTAL_FRAMES) * 920, 12);
      ctx.restore();
    }

    function updateUI() {
      const p = currentFrame / TOTAL_FRAMES;
      document.getElementById('timelineFill').style.width = (p * 100) + '%';
      document.getElementById('timelineThumb').style.left = (p * 100) + '%';

      const sec = (currentFrame / FPS).toFixed(1);
      document.getElementById('timeReadout').textContent = `${sec}s / ${DURATION_SEC}s (${currentFrame})`;

      const actIdx = Math.min(3, Math.floor(currentFrame / FRAMES_PER_ACT));
      document.querySelectorAll('.chapter-pill').forEach((pill, idx) => {
        pill.classList.toggle('active', idx === actIdx);
      });
    }

    function loop() {
      if (!isPlaying) return;
      currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      renderFrame(currentFrame);
      updateUI();
      animationId = requestAnimationFrame(loop);
    }

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ 暫停' : '▶ 播放';
      if (isPlaying) loop();
      else cancelAnimationFrame(animationId);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      isPlaying = false;
      playBtn.textContent = '▶ 播放';
      cancelAnimationFrame(animationId);
      currentFrame = 0;
      renderFrame(0);
      updateUI();
    });

    document.querySelectorAll('.chapter-pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        const f = parseInt(e.target.dataset.frame, 10);
        currentFrame = f;
        renderFrame(currentFrame);
        updateUI();
      });
    });

    // 拖曳時間軸
    const wrapper = document.getElementById('timelineWrapper');
    let isDragging = false;
    function seek(e) {
      const rect = wrapper.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentFrame = Math.floor(pos * TOTAL_FRAMES);
      renderFrame(currentFrame);
      updateUI();
    }
    wrapper.addEventListener('mousedown', (e) => { isDragging = true; seek(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) seek(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // 初始化第 0 幀
    renderFrame(0);
    updateUI();

    window.renderFrame = renderFrame;
    window.TOTAL_FRAMES = TOTAL_FRAMES;
  </script>
</body>
</html>
