<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 如何繼續、完成或暫停？</title><style>body{margin:24px;background:#f7f5ee;color:#20231f;font-family:system-ui}main{max-width:900px;margin:auto}svg{width:100%;height:auto}h1{font-size:26px}</style><main><h1>Agent 如何繼續、完成或暫停？</h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1024" role="img" aria-labelledby="agent-flow-title agent-flow-desc"><title id="agent-flow-title">Agent 如何繼續、完成或暫停？</title><desc id="agent-flow-desc">先準備資訊，模型提出請求，通過格式與權限檢查後工具執行；核對達標便交付，未完成且可繼續時回到模型，無法繼續時暫停詢問。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#415c49" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}</style><rect width="480" height="1024" fill="#f7f5ee"/><text x="240" y="34" font-size="26" fill="#20231f" text-anchor="middle">從任務到交付</text><text x="240" y="62" font-size="16" fill="#535950" text-anchor="middle">工具任務示例：報名表 → 人數圖</text><path d="M240 160 V190" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M240 266 V300" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M240 380 V420" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M240 496 V532" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M240 608 V648" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M240 728 V788" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M140 688 H40 V228 H108" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M340 340 H444 V892 H372" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M340 688 H412 V932 H372" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="108" y="84" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="240.0" y="114" font-size="20" fill="#20231f" text-anchor="middle">準備本輪 Context</text><text x="240.0" y="139" font-size="15" fill="#535950" text-anchor="middle">任務、報名表、規則</text><rect x="108" y="190" width="264" height="76" rx="6" fill="#e6e9dc" stroke="#415c49"/><text x="240.0" y="220" font-size="20" fill="#20231f" text-anchor="middle">LLM 判斷下一步</text><text x="240.0" y="245" font-size="15" fill="#535950" text-anchor="middle">提出工具請求</text><path d="M 240 300 L 340 340 L 240 380 L 140 340 Z" fill="#fffefa" stroke="#873b29" stroke-width="1.6"/><text x="240" y="347" font-size="20" fill="#20231f" text-anchor="middle">請求可執行？</text><rect x="108" y="420" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="240.0" y="450" font-size="20" fill="#20231f" text-anchor="middle">工具實際執行</text><text x="240.0" y="475" font-size="15" fill="#535950" text-anchor="middle">計算、製圖，回傳結果</text><rect x="108" y="532" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="240.0" y="562" font-size="20" fill="#20231f" text-anchor="middle">更新 Context</text><text x="240.0" y="587" font-size="15" fill="#535950" text-anchor="middle">帶回結果，核對完成條件</text><path d="M 240 648 L 340 688 L 240 728 L 140 688 Z" fill="#fffefa" stroke="#873b29" stroke-width="1.6"/><text x="240" y="695" font-size="20" fill="#20231f" text-anchor="middle">已經完成？</text><rect x="108" y="788" width="264" height="76" rx="24" fill="#e6e9dc" stroke="#415c49"/><text x="240.0" y="818" font-size="20" fill="#20231f" text-anchor="middle">完成：交付結果</text><text x="240.0" y="843" font-size="15" fill="#535950" text-anchor="middle">圖表、文字或介面</text><rect x="108" y="876" width="264" height="76" rx="24" fill="#fffefa" stroke="#8c9187"/><text x="240.0" y="906" font-size="20" fill="#20231f" text-anchor="middle">暫停：詢問使用者</text><text x="240.0" y="931" font-size="15" fill="#5359
