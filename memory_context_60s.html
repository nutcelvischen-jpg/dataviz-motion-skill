  <script>
    const FPS = 30;
    const DURATION_SEC = 60.0;
    const TOTAL_FRAMES = FPS * DURATION_SEC; // 1800 frames
    const FRAMES_PER_ACT = 450; // 15s each

    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');

    // 4 幕手繪短片定義 (字數刪除 30%，字體大幅放大至 52px)
    const ACTS = [

    let currentFrame = 0;
    let isPlaying = false;
    let animationId = null;

    // 手繪有機圓角矩形 (Hand-drawn wobbly rounded rect)
    function drawHandRect(context, x, y, w, h, r = 16, strokeColor = '#1C1917', fillColor = '#FFFFFF', lineWidth = 4) {
      context.save();
      context.beginPath();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.lineWidth = lineWidth;
      context.strokeStyle = strokeColor;
      context.fillStyle = fillColor;

      context.roundRect(x, y, w, h, r);
      if (fillColor) context.fill();
      if (strokeColor && lineWidth > 0) context.stroke();
      context.restore();
    }

    // 手繪 Apple Pencil / Stylus
    function drawStylus(context, tipX, tipY, angleDeg = 135, scale = 1.05) {
      context.save();
      context.translate(tipX, tipY);
      context.rotate((angleDeg * Math.PI) / 180);
      context.scale(scale, scale);

      // 柔和投影
      context.shadowColor = 'rgba(28, 25, 23, 0.22)';
      context.shadowBlur = 18;
      context.shadowOffsetX = 8;
      context.shadowOffsetY = 14;

      // 1. 筆尖 (Nib)
      context.beginPath();
      context.moveTo(0, 0);
      context.lineTo(14, -28);
      context.lineTo(-14, -28);
      context.closePath();
      context.fillStyle = '#1C1917';
      context.fill();

      // 2. 錐體筆頭
      context.beginPath();
      context.moveTo(14, -28);
      context.lineTo(16, -52);
      context.lineTo(-16, -52);
      context.lineTo(-14, -28);
      context.closePath();
      context.fillStyle = '#F4F4F5';
      context.fill();
      context.strokeStyle = '#1C1917';
      context.lineWidth = 3;
      context.stroke();

      // 3. 筆身主體 (White Barrel)
      context.beginPath();
      context.rect(-16, -210, 32, 158);
      context.fillStyle = '#FFFFFF';
      context.fill();
      context.strokeStyle = '#1C1917';
      context.lineWidth = 3.5;
      context.stroke();

      // 筆身光澤線
      context.beginPath();
      context.moveTo(-8, -200);
      context.lineTo(-8, -60);
      context.strokeStyle = 'rgba(228, 228, 231, 0.9)';
      context.lineWidth = 3;
      context.stroke();

      // 4. 紫色質感裝飾環
      context.beginPath();
      context.rect(-16, -230, 32, 20);
      context.fillStyle = '#6366F1';
      context.fill();
      context.strokeStyle = '#1C1917';
      context.lineWidth = 3.5;
      context.stroke();

      // 5. 頂端筆帽
      context.beginPath();
      context.roundRect(-16, -250, 32, 20, [10, 10, 0, 0]);
      context.fillStyle = '#1C1917';
      context.fill();

      context.restore();
    }

    // 科技講透透招牌：52px 超大字體雙語螢光筆字幕
    function drawHighlightedSubtitle(context, segments, enText, baseY) {
      context.save();
      
      // 字體大幅調高至 52px 粗體
      context.font = '900 52px "Noto Sans TC", sans-serif';
      let totalW = 0;
      const metricsList = segments.map(seg => {
        const w = context.measureText(seg.text).width;
        totalW += w + (seg.hl ? 16 : 0);
        return { ...seg, width: w };
      });

      // 起始居中 X
      let curX = Math.max(50, (1080 - totalW) / 2);
      const textY = baseY;

      // 繪製中文與螢光筆底色
      metricsList.forEach(seg => {
        if (seg.hl) {
          // 螢光筆黃色高光方塊 (柔和圓角)
          context.fillStyle = '#FEF08A';
          context.beginPath();
          context.roundRect(curX - 6, textY - 52, seg.width + 16, 64, 10);
          context.fill();

          // 高光文字 (鮮亮皇家藍)
          context.fillStyle = '#2563EB';
          context.fillText(seg.text, curX + 2, textY);
          curX += seg.width + 16;
        } else {
          // 一般文字 (深炭黑)
          context.fillStyle = '#1C1917';
          context.fillText(seg.text, curX, textY);
          curX += seg.width;
        }
      });

      // 繪製下方英文說明 (灰色手寫副標)
      if (enText) {
        context.font = '500 24px "Noto Sans TC", sans-serif';
        context.fillStyle = '#57534E';
        context.textAlign = 'center';
        context.fillText(enText, 540, textY + 52);
        context.textAlign = 'left';
      }

      context.restore();
    }

    // 核心逐幀渲染器
    function renderFrame(f) {
      ctx.clearRect(0, 0, 1080, 1920);

      // 1. 溫潤米白手帳紙底色 (#FBF9F4)
      ctx.fillStyle = '#FBF9F4';
      ctx.fillRect(0, 0, 1080, 1920);

      // 2. 灰色點陣網格 (Dot Grid Notebook)
      ctx.fillStyle = '#E2DDD5';
      const dotSpacing = 48;
      for (let x = 24; x < 1080; x += dotSpacing) {
        for (let y = 24; y < 1920; y += dotSpacing) {
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const actIdx = Math.min(3, Math.floor(f / FRAMES_PER_ACT));
      const act = ACTS[actIdx];
      const localFrame = f % FRAMES_PER_ACT;
      const localSec = localFrame / FPS;

      // 3. 頂部導航欄 (Top Header)
      ctx.save();
      // 左側漸層對話泡泡 Logo
      const grad = ctx.createLinearGradient(70, 95, 110, 135);
      grad.addColorStop(0, '#10B981');
      grad.addColorStop(1, '#6366F1');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(70, 95, 42, 38, [12, 12, 12, 2]);
      ctx.fill();

      // 品牌字樣
      ctx.fillStyle = '#1E1B4B';
      ctx.font = '800 32px "Noto Sans TC", sans-serif';
      ctx.fillText(act.brand, 126, 126);

      // 右側手繪紫色膠囊標籤「科技入門 · AI 第 2 課」
      drawHandRect(ctx, 580, 88, 430, 56, 16, '#6366F1', '#FFFFFF', 3.5);
      ctx.fillStyle = '#4F46E5';
      ctx.font = '700 24px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(act.tag, 795, 125);
      ctx.textAlign = 'left';
      ctx.restore();

      // 4. 當前幕主題手繪標題
      ctx.save();
      ctx.fillStyle = '#1C1917';
      ctx.font = '900 46px "Noto Sans TC", sans-serif';
      ctx.fillText(act.title, 80, 240);

      // 英文副標題 / 概念小標
      ctx.fillStyle = '#6366F1';
      ctx.font = '700 24px "Noto Sans TC", sans-serif';
      ctx.fillText('💡 ' + act.subtitle, 80, 290);
      ctx.restore();

      // 5. 各幕中央手繪教學圖解 (Main Whiteboard Illustration)
      ctx.save();

      if (actIdx === 0) {
        // ========== 幕 1 · 3 欄手繪卡片 (貓咪記憶懸念) ==========
        const cardW = 286;
        const cardH = 580;
        const startY = 360;

        // 卡片 1: 橘貓咪咪
        drawHandRect(ctx, 70, startY, cardW, cardH, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 90, startY + 20, 44, 44, 22, '#1C1917', '#FEF08A', 3);
        ctx.fillStyle = '#1C1917';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('①', 101, startY + 52);

        ctx.font = '96px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🐱', 70 + cardW / 2, startY + 180);
        ctx.font = '800 30px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#EA580C';
        ctx.fillText('橘貓咪咪', 70 + cardW / 2, startY + 260);

        ctx.fillStyle = '#FEF08A';
        ctx.fillRect(70 + 35, startY + 310, cardW - 70, 52);
        ctx.fillStyle = '#2563EB';
        ctx.font = '700 22px "Noto Sans TC", sans-serif';
        ctx.fillText('我養貓叫咪咪', 70 + cardW / 2, startY + 346);

        ctx.fillStyle = '#57534E';
        ctx.font = '500 20px "Noto Sans TC", sans-serif';
        ctx.fillText('第一輪對話輸入', 70 + cardW / 2, startY + 440);

        // 卡片 2: 使用者考題
        drawHandRect(ctx, 396, startY, cardW, cardH, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 416, startY + 20, 44, 44, 22, '#1C1917', '#FEF08A', 3);
        ctx.fillStyle = '#1C1917';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('②', 427, startY + 52);

        drawHandRect(ctx, 420, startY + 110, cardW - 48, 220, 14, '#6366F1', '#EEF2FF', 3);
        ctx.fillStyle = '#4F46E5';
        ctx.font = '700 22px "Noto Sans TC", sans-serif';
        ctx.fillText('💬 隔了幾句問：', 396 + cardW / 2, startY + 160);
        ctx.fillStyle = '#1C1917';
        ctx.font = '700 22px "Noto Sans TC", sans-serif';
        ctx.fillText('「我家的貓', 396 + cardW / 2, startY + 215);
        ctx.fillText('叫什麼名字？」', 396 + cardW / 2, startY + 255);

        ctx.fillStyle = '#57534E';
        ctx.font = '500 20px "Noto Sans TC", sans-serif';
        ctx.fillText('跨輪次記憶考驗', 396 + cardW / 2, startY + 440);

        // 卡片 3: AI 秒答
        drawHandRect(ctx, 722, startY, cardW, cardH, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 742, startY + 20, 44, 44, 22, '#1C1917', '#FEF08A', 3);
        ctx.fillStyle = '#1C1917';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('③', 753, startY + 52);

        drawHandRect(ctx, 746, startY + 110, cardW - 48, 220, 14, '#10B981', '#ECFDF5', 3);
        ctx.fillStyle = '#059669';
        ctx.font = '800 22px "Noto Sans TC", sans-serif';
        ctx.fillText('🤖 AI 秒答：', 722 + cardW / 2, startY + 160);
        ctx.font = '800 32px "Noto Sans TC", sans-serif';
        ctx.fillText('「叫咪咪！」', 722 + cardW / 2, startY + 230);

        ctx.fillStyle = '#059669';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('✨ 完美答對！', 722 + cardW / 2, startY + 440);
        ctx.textAlign = 'left';

      } else if (actIdx === 1) {
        // ========== 幕 2 · 金魚腦真相 (無狀態靜態矩陣) ==========
        // 卡片 1: 金魚腦大解密
        drawHandRect(ctx, 70, 360, 940, 260, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 94, 385, 480, 46, 12, '#DC2626', '#FEF2F2', 3);
        ctx.fillStyle = '#DC2626';
        ctx.font = '800 22px "Noto Sans TC", sans-serif';
        ctx.fillText('🐠 殘酷真相：模型是 0 秒失憶金魚腦！', 114, 417);

        ctx.font = '96px sans-serif';
        ctx.fillText('🐠', 140, 560);
        ctx.fillStyle = '#1C1917';
        ctx.font = '800 30px "Noto Sans TC", sans-serif';
        ctx.fillText('大模型根本沒有「記憶硬碟」！', 280, 500);
        ctx.font = '500 22px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#57534E';
        ctx.fillText('每次回答一結束，所有中間變量立刻被清空，下一秒完全不認得你！', 280, 545);

        // 卡片 2: 靜態無狀態矩陣本質
        drawHandRect(ctx, 70, 660, 940, 380, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 94, 685, 480, 46, 12, '#6366F1', '#EEF2FF', 3);
        ctx.fillStyle = '#4F46E5';
        ctx.font = '800 22px "Noto Sans TC", sans-serif';
        ctx.fillText('⚡ 數學本質：完全無狀態靜態矩陣 (Stateless)', 114, 717);

        drawHandRect(ctx, 114, 760, 852, 100, 14, '#E2DDD5', '#F5F5F4', 2);
        ctx.fillStyle = '#0F172A';
        ctx.font = '700 26px "JetBrains Mono", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Output = Softmax( Weights_frozen · Input + Bias )', 540, 820);

        drawHandRect(ctx, 114, 890, 852, 110, 14, '#DC2626', '#FEF2F2', 2);
        ctx.fillStyle = '#991B1B';
        ctx.font = '800 26px "Noto Sans TC", sans-serif';
        ctx.fillText('⚠️ 核心定理：它是一個純粹的無狀態數學函數！', 540, 940);
        ctx.font = '600 20px "Noto Sans TC", sans-serif';
        ctx.fillText('每一次 API 呼叫，對模型而言都是宇宙誕生的第一秒！', 540, 975);
        ctx.textAlign = 'left';

      } else if (actIdx === 2) {
        // ========== 幕 3 · 對話小抄大揭密 ==========
        drawHandRect(ctx, 70, 360, 940, 680, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 94, 385, 520, 46, 12, '#059669', '#ECFDF5', 3);
        ctx.fillStyle = '#059669';
        ctx.font = '800 22px "Noto Sans TC", sans-serif';
        ctx.fillText('📝 幕後魔術：前端偷偷傳送「整本對話小抄」', 114, 417);

        // 5 頁小抄卡片堆疊
        const cheatSheets = [
          { tag: '第 1 頁', text: 'User: 我有養一隻貓叫咪咪', bg: '#FEF9C3' },
          { tag: '第 2 頁', text: 'AI: 好的，已記住咪咪！', bg: '#F0FDF4' },
          { tag: '第 3 頁', text: 'User: 今天台北天氣怎麼樣？', bg: '#EFF6FF' },
          { tag: '第 4 頁', text: 'AI: 今天台北晴空萬里。', bg: '#FAF5FF' },
          { tag: '第 5 頁', text: 'User: 我養的貓叫什麼名字？', bg: '#FFF1F2' }
        ];

        cheatSheets.forEach((cs, idx) => {
          const sy = 460 + idx * 78;
          drawHandRect(ctx, 120, sy, 840, 64, 12, '#1C1917', cs.bg, 2.5);
          drawHandRect(ctx, 140, sy + 12, 110, 40, 8, '#1C1917', '#FFFFFF', 2);
          ctx.fillStyle = '#1C1917';
          ctx.font = '700 18px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(cs.tag, 195, sy + 38);

          ctx.textAlign = 'left';
          ctx.font = '700 22px "Noto Sans TC", sans-serif';
          ctx.fillText(cs.text, 275, sy + 40);
        });

        // 底部紅框總結
        drawHandRect(ctx, 120, 880, 840, 120, 14, '#DC2626', '#FEF2F2', 2.5);
        ctx.fillStyle = '#991B1B';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('👉 你以為它在「回憶」？其實每次都把整本歷史重讀一遍！', 540, 935);
        ctx.font = '600 20px "Noto Sans TC", sans-serif';
        ctx.fillText('聊天越長，Token 消耗呈階梯式暴增，帳單越來越貴！', 540, 970);
        ctx.textAlign = 'left';

      } else {
        // ========== 幕 4 · 裁切極限與親手實測 ==========
        drawHandRect(ctx, 70, 360, 940, 340, 20, '#1C1917', '#FFFFFF', 4);
        drawHandRect(ctx, 94, 385, 460, 46, 12, '#DC2626', '#FEF2F2', 3);
        ctx.fillStyle = '#DC2626';
        ctx.font = '800 22px "Noto Sans TC", sans-serif';
        ctx.fillText('✂️ 極限翻車：Context Window 滿載裁切！', 114, 417);

        ctx.font = '90px sans-serif';
        ctx.fillText('✂️', 130, 560);
        ctx.fillStyle = '#1C1917';
        ctx.font = '800 28px "Noto Sans TC", sans-serif';
        ctx.fillText('一旦對話超出窗口，頂部小抄被剪斷！', 270, 500);

        drawHandRect(ctx, 270, 530, 700, 68, 12, '#DC2626', '#FFF1F2', 2);
        ctx.fillStyle = '#DC2626';
        ctx.font = '800 24px "Noto Sans TC", sans-serif';
        ctx.fillText('「咪咪」的名字已被剪刀扔掉 ➔ 瞬間失憶！', 290, 572);

        // 黃色手帳便利貼 (Sticky Memo)
        drawHandRect(ctx, 70, 730, 940, 210, 18, '#CA8A04', '#FEF08A', 3.5);
        ctx.fillStyle = '#DC2626';
        ctx.beginPath();
        ctx.arc(540, 750, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#713F12';
        ctx.font = '900 30px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📌 認知帶走：', 540, 805);
        ctx.font = '800 34px "Noto Sans TC", sans-serif';
        ctx.fillText('大模型沒有腦容量，全靠上下文小抄！', 540, 855);
        ctx.font = '600 22px "Noto Sans TC", sans-serif';
        ctx.fillText('學會管理 Context 窗口，才不會花冤枉錢！', 540, 900);

        // 立即動手實測按鈕 (Call To Action)
        drawHandRect(ctx, 70, 970, 940, 110, 20, '#6366F1', '#EEF2FF', 4);
        ctx.fillStyle = '#4F46E5';
        ctx.font = '900 36px "Noto Sans TC", sans-serif';
        ctx.fillText('👉 點擊下方連結，到極簡實驗室親手實測！', 540, 1040);
        ctx.textAlign = 'left';
      }
      ctx.restore();

      // 6. 動態字幕選取與觸控筆導引 (Apple Pencil Guide)
      let activeCue = act.cues[0];
      for (const cue of act.cues) {
        if (localSec >= cue.startSec && localSec < cue.endSec) {
          activeCue = cue;
          break;
        }
      }

      // 筆尖在各卡片平滑浮動指引
      const target = activeCue.stylus;
      const wobbleX = Math.sin((f / 30) * 2.5) * 10;
      const wobbleY = Math.cos((f / 30) * 2.5) * 8;
      drawStylus(ctx, target.x + wobbleX, target.y + wobbleY, target.angle || 135, 1.05);

      // 7. 科技講透透招牌：52px 大字體雙語螢光筆高光字幕 (y = 1440)
      drawHighlightedSubtitle(ctx, activeCue.segments, activeCue.en, 1440);

      // 8. 底部安全進度條
      ctx.save();
      ctx.fillStyle = '#E2DDD5';
      ctx.fillRect(80, 1530, 920, 8);
      ctx.fillStyle = '#6366F1';
      ctx.fillRect(80, 1530, (f / TOTAL_FRAMES) * 920, 8);
      ctx.restore();
    }

    function updateUI() {
      const p = currentFrame / TOTAL_FRAMES;
      document.getElementById('timelineFill').style.width = (p * 100) + '%';
      document.getElementById('timelineThumb').style.left = (p * 100) + '%';

      const sec = (currentFrame / FPS).toFixed(1);
      document.getElementById('timeReadout').textContent = `${sec}s / ${DURATION_SEC}s (${currentFrame})`;

      const actIdx = Math.min(3, Math.floor(currentFrame / FRAMES_PER_ACT));
      document.querySelectorAll('.chapter-pill').forEach((pill, idx) => {
        pill.classList.toggle('active', idx === actIdx);
      });
    }

    function loop() {
      if (!isPlaying) return;
      currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      renderFrame(currentFrame);
      updateUI();
      animationId = requestAnimationFrame(loop);
    }

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ 暫停' : '▶ 播放';
      if (isPlaying) loop();
      else cancelAnimationFrame(animationId);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      isPlaying = false;
      playBtn.textContent = '▶ 播放';
      cancelAnimationFrame(animationId);
      currentFrame = 0;
      renderFrame(0);
      updateUI();
    });

    document.querySelectorAll('.chapter-pill').forEach(pill => {
      pill.addEventListener('click', (e) => {
        const f = parseInt(e.target.dataset.frame, 10);
        currentFrame = f;
        renderFrame(currentFrame);
        updateUI();
      });
    });

    // 拖曳時間軸
    const wrapper = document.getElementById('timelineWrapper');
    let isDragging = false;
    function seek(e) {
      const rect = wrapper.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentFrame = Math.floor(pos * TOTAL_FRAMES);
      renderFrame(currentFrame);
      updateUI();
    }
    wrapper.addEventListener('mousedown', (e) => { isDragging = true; seek(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) seek(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // 初始化第 0 幀
    renderFrame(0);
    updateUI();

    window.renderFrame = renderFrame;
    window.TOTAL_FRAMES = TOTAL_FRAMES;
  </script>
</body>
</html>
