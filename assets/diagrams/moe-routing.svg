<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 688" role="img" aria-labelledby="moe-routing-title moe-routing-desc" id="moe-routing-root"><title id="moe-routing-title">MoE 混合專家的運算分流</title><desc id="moe-routing-desc">路由器依 Token 表示選出部分專家參與運算，再合併選中的結果；其餘專家本次不參與這部分計算。</desc><defs>
      <style>#moe-routing-root { color: #20231f; font-family: system-ui; }
      #moe-routing-root text { font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif }</style><marker id="moe-routing-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#415c49" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}</style><rect width="800" height="688" fill="#f7f5ee"/><text x="400" y="42" font-size="26" fill="#20231f" text-anchor="middle">MoE：每次選出部分專家</text><text x="400" y="74" font-size="17" fill="#535950" text-anchor="middle">模型內部的運算分流，不是多個 Agent 開會</text><path d="M400 168 V204" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#moe-routing-arr)"/><path d="M300 280 V300 H112 V348" fill="none" stroke="#415c49" stroke-width="1.6" stroke-dasharray='5 4' marker-end="url(#moe-routing-arr)"/><path d="M364 280 V312 H304 V348" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#moe-routing-arr)"/><path d="M436 280 V324 H496 V348" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#moe-routing-arr)"/><path d="M500 280 V300 H688 V348" fill="none" stroke="#415c49" stroke-width="1.6" stroke-dasharray='5 4' marker-end="url(#moe-routing-arr)"/><path d="M304 420 V464 H364 V500" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#moe-routing-arr)"/><path d="M496 420 V464 H436 V500" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#moe-routing-arr)"/><rect x="268" y="96" width="264" height="72" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="400.0" y="126" font-size="20" fill="#20231f" text-anchor="middle">Token 的內部表示</text><rect x="268" y="204" width="264" height="76" rx="6" fill="#e6e9dc" stroke="#415c49"/><text x="400.0" y="234" font-size="20" fill="#20231f" text-anchor="middle">路由器 Router</text><text x="400.0" y="259" font-size="15" fill="#535950" text-anchor="middle">依輸入選擇部分模組</text><rect x="32" y="348" width="160" height="72" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="112.0" y="378" font-size="20" fill="#20231f" text-anchor="middle">專家 1</text><text x="112.0" y="403" font-size="15" fill="#535950" text-anchor="middle">這次未選中</text><rect x="224" y="348" width="160" height="72" rx="6" fill="#e6e9dc" stroke="#415c49"/><text x="304.0" y="378" font-size="20" fill="#20231f" text-anchor="middle">專家 2</text><text x="304.0" y="403" font-size="15" fill="#535950" text-anchor="middle">這次參與運算</text><rect x="416" y="348" width="160" height="72" rx="6" fill="#e6e9dc" stroke="#415c49"/><text x="496.0" y="378" font-size="20" fill="#20231f" text-anchor="middle">專家 3</text><text x="496.0" y="403" font-size="15" fill="#535950" text-anchor="middle">這次參與運算</text><rect x="608" y="348" width="160" height="72" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="688.0" y="378" font-size="20" fill="#20231f" text-anchor="middle">專家 4</text><text x="688.0" y="403" font-size="15" fill="#535950" text-anchor="middle">這次未選中</text><rect x="268" y="500" width="264" height="72" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="400.0" y="530" font-size="20" fill="#20231f" text-anchor="middle">合併選中結果</text><text x="400" y="618" font-size="17" fill="#535950" text-anchor="middle">示意：四個模組中選兩個；實際數量與路由依模型而異。</text><text x="400" y="650" font-size="17" fill="#535950" text-anchor="middle">專家是網路模組，不一定對應數學、程式等人類學科。</text></svg>
