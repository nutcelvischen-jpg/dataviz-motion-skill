<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 776" role="img" aria-labelledby="rag-context-title rag-context-desc" id="rag-context-root"><title id="rag-context-title">RAG 的資料如何進入回答</title><desc id="rag-context-desc">問題與文件來源匯入檢索，選出的相關片段和來源加入 Context，模型再依資料整理回答；仍須核對日期與原文。</desc><defs>
      <style>#rag-context-root { color: #20231f; font-family: system-ui; }
      #rag-context-root text { font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif }</style><marker id="rag-context-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#415c49" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}</style><rect width="800" height="776" fill="#f7f5ee"/><text x="400" y="42" font-size="26" fill="#20231f" text-anchor="middle">RAG：先找依據，再交給模型</text><path d="M224 164 V224 H304 V264" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#rag-context-arr)"/><path d="M576 164 V224 H496 V264" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#rag-context-arr)"/><path d="M400 340 V380" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#rag-context-arr)"/><path d="M400 456 V496" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#rag-context-arr)"/><path d="M400 572 V612" fill="none" stroke="#415c49" stroke-width="1.6"  marker-end="url(#rag-context-arr)"/><rect x="80" y="88" width="288" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="224.0" y="118" font-size="20" fill="#20231f" text-anchor="middle">使用者問題</text><text x="224.0" y="143" font-size="15" fill="#535950" text-anchor="middle">「這次活動能不能候補？」</text><rect x="432" y="88" width="288" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="576.0" y="118" font-size="20" fill="#20231f" text-anchor="middle">外部文件來源</text><text x="576.0" y="143" font-size="15" fill="#535950" text-anchor="middle">本次活動簡章、規定</text><rect x="268" y="264" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="400.0" y="294" font-size="20" fill="#20231f" text-anchor="middle">檢索相關段落</text><text x="400.0" y="319" font-size="15" fill="#535950" text-anchor="middle">關鍵字、向量或混合方式</text><rect x="268" y="380" width="264" height="76" rx="6" fill="#e6e9dc" stroke="#415c49"/><text x="400.0" y="410" font-size="20" fill="#20231f" text-anchor="middle">選出的片段與來源</text><text x="400.0" y="435" font-size="15" fill="#535950" text-anchor="middle">候補規定、日期、出處</text><rect x="268" y="496" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="400.0" y="526" font-size="20" fill="#20231f" text-anchor="middle">加入本輪 Context</text><text x="400.0" y="551" font-size="15" fill="#535950" text-anchor="middle">問題 ＋ 找到的資料</text><rect x="268" y="612" width="264" height="76" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="400.0" y="642" font-size="20" fill="#20231f" text-anchor="middle">LLM 整理回答</text><text x="400.0" y="667" font-size="15" fill="#535950" text-anchor="middle">依片段回答並核對來源</text><text x="400" y="738" font-size="17" fill="#535950" text-anchor="middle">找到舊規定，仍可能答錯；檢索不會自動保證正確。</text></svg>
