<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" role="img" aria-labelledby="llm-mindmap-title llm-mindmap-desc" id="llm-mindmap-root"><title id="llm-mindmap-title">AI 助手的六個核心問題</title><desc id="llm-mindmap-desc">六個分支分別說明模型、上下文、資料來源、工具、工作控制及品質檢查。</desc><defs>
