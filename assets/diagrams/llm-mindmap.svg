chor="middle">這次要給它什麼？</text><text x="544.0" y="251" font-size="15" fill="#535950" text-anchor="middle">Prompt · Context</text><rect x="324" y="292" width="440" height="80" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="544.0" y="322" font-size="20" fill="#20231f" text-anchor="middle">資料從哪裡來？</text><text x="544.0" y="347" font-size="15" fill="#535950" text-anchor="middle">RAG · Memory</text><rect x="324" y="388" width="440" height="80" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="544.0" y="418" font-size="20" fill="#20231f" text-anchor="middle">誰真的去執行？</text><text x="544.0" y="443" font-size="15" fill="#535950" text-anchor="middle">Tool · API · MCP</text><rect x="324" y="484" width="440" height="80" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="544.0" y="514" font-size="20" fill="#20231f" text-anchor="middle">下一步由誰決定？</text><text x="544.0" y="539" font-size="15" fill="#535950" text-anchor="middle">Workflow · Agent Loop</text><rect x="324" y="580" width="440" height="80" rx="6" fill="#fffefa" stroke="#8c9187"/><text x="544.0" y="610" font-size="20" fill="#20231f" text-anchor="middle">怎麼確認做對了？</text><text x="544.0" y="635" font-size="15" fill="#535950" text-anchor="middle">Evals · 權限 · Trace</text><text x="400" y="732" font-size="17" fill="#535950" text-anchor="middle">這是概念分類；學習順序仍依網站原有六站課程。</text></svg>
